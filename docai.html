<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vértice 2 | DocAI - Sistema de Inteligência Corporativa</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        :root {
            --bg-main: #060814;
            --bg-sidebar: #0b0e1f;
            --bg-card: #121736;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --accent-orange: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
        }

        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: var(--accent-blue); }
        .menu-links { list-style: none; margin-top: 3rem; flex-grow: 1; }
        .menu-links li { padding: 1rem; margin-bottom: 0.5rem; border-radius: 8px; color: var(--text-muted); font-weight: 500; cursor: pointer; }
        .menu-links li.active { background: rgba(56, 189, 248, 0.1); color: var(--accent-blue); }

        /* CONTEÚDO PRINCIPAL */
        .main-content { margin-left: 260px; flex-grow: 1; padding: 3rem; max-width: 1300px; width: calc(100% - 260px); }
        .header-dash { margin-bottom: 3rem; }
        .header-dash h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -1px; }
        .header-dash p { color: var(--text-muted); font-weight: 300; }

        /* METRICAS */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .metric-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; border-left: 4px solid var(--accent-blue); }
        .metric-card span { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 5px; }
        .metric-card h2 { font-size: 1.8rem; font-weight: 700; }

        /* WORKSPACE */
        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 3rem; }
        .panel { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; }
        .panel h3 { font-size: 1.3rem; margin-bottom: 1.5rem; }

        /* UPLOAD */
        .dropzone {
            border: 2px dashed rgba(56, 189, 248, 0.3);
            background: rgba(6, 8, 20, 0.5);
            border-radius: 12px;
            padding: 4.5rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dropzone:hover { border-color: var(--accent-blue); background: rgba(56, 189, 248, 0.02); }
        .dropzone p { font-size: 1rem; margin-bottom: 5px; }
        .dropzone span { color: var(--text-muted); font-size: 0.8rem; }

        /* OUTPUT IA */
        .ai-output-box {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            min-height: 235px;
            font-size: 0.95rem;
            line-height: 1.6;
            overflow-y: auto;
            max-height: 300px;
        }

        .status-loading {
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            padding: 3rem 0;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(56, 189, 248, 0.1);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* GRÁFICO E ANÁLISES COGNITIVAS */
        .chart-panel { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 2rem; }
        @media (max-width: 992px) { .chart-panel { grid-template-columns: 1fr; } }
        .chart-container { position: relative; width: 100%; height: 320px; }
        
        .technical-analysis {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .technical-analysis h4 { color: var(--accent-blue); font-size: 1.1rem; margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .technical-analysis p { font-size: 0.9rem; line-height: 1.6; color: #d1d5db; }
        .insight-tag { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-top: 15px; text-transform: uppercase; align-self: flex-start; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="logo">VÉRTICE<span> 2</span></div>
            <ul class="menu-links">
                <li class="active">📊 DocAI Dashboard</li>
                <li onclick="window.location.href='index.html'" style="margin-top: 2rem; border: 1px solid rgba(56, 189, 248, 0.2); background: rgba(56, 189, 248, 0.03); color: var(--accent-blue);">
                    ↩ Voltar para Home
                </li>
            </ul>
        </div>
        <div class="user-profile">
            <p>Rafael Diretor</p>
            <span>Vértice Consultoria</span>
        </div>
    </div>
